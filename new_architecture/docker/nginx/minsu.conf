events {
    worker_connections 1024;
}

http {
    # 设置基本的HTTP参数
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 设置默认的MIME类型
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志设置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 生产环境上游服务器配置（使用localhost而非Docker服务名）
    upstream frontend_client {
        server 127.0.0.1:3000;  # 假设前端客户端运行在3000端口
    }

    upstream backend {
        server 127.0.0.1:8000;  # 后端API服务
    }

    server {
        listen 80;
        server_name localhost;  # 可以替换为实际域名

        # 前端客户端
        location / {
            proxy_pass http://frontend_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 增加超时设置避免502错误
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲区设置
            proxy_buffers 4 256k;
            proxy_buffer_size 128k;
            proxy_busy_buffers_size 256k;
        }

        # 后端API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 增加超时设置避免502错误
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 静态文件处理（如果有）
        location /static/ {
            alias /path/to/your/static/files/;  # 替换为实际静态文件路径
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # 错误页面处理
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}